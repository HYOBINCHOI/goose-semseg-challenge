# Config for GOOSE, Mask2Former training

bs: 2
n_gpus: 1
metric_to_save: "mIoU"
model_dtype: BFLOAT16
scheduler:
  total_iter: 40000
  type: "WarmupOneCycleLR"
  constructor_kwargs:
    warmup_iters: 1500
    warmup_ratio: 1e-6
    final_div_factor: .inf
    pct_start: 0
    anneal_strategy: "cos"
    use_beta1: False
    update_momentum: False
optimizer:
  lr: 6e-5
  beta1: 0.9
  beta2: 0.999
  weight_decay: 1e-2
  gradient_clip: 35.0
datasets:
  root: "/home/datasets/goose-dataset"  # Path to goose-dataset
  train: "GOOSE:split=TRAIN"
  val: "GOOSE:split=VAL"
decoder_head:
  type: "m2f"
  backbone_out_layers: FOUR_EVEN_INTERVALS
  num_classes: 64
  hidden_dim: 2048
train:
  m2f_no_object_weight: 0.1
  m2f_class_weight: 2.0
  m2f_mask_weight: 5.0
  m2f_dice_weight: 5.0
  m2f_train_num_points: 12544
  m2f_oversample_ratio: 3.0
  m2f_importance_sample_ratio: 0.75
transforms:
  train:
    img_size: 512
    random_img_size_ratio_range: [0.5, 2.0]
    crop_size: [512, 512]
    flip_prob: 0.5
  eval:
    img_size: 512
eval:
  compute_metric_per_image: False
  reduce_zero_label: False
  mode: "slide"
  crop_size: 512
  stride: 341
  eval_interval: 5000
  use_tta: False
